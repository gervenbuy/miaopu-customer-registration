<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苗圃農產行｜客戶資料登記</title><style>
:root{--green:#174b32;--cream:#faf7ed;--gold:#b48b43}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#243f30;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.6}.page{max-width:900px;margin:48px auto;padding:0 24px}.brand{font-size:15px;letter-spacing:4px;color:var(--green);font-weight:700}.hero{padding:24px 0 30px;position:relative}h1{font-size:clamp(30px,5vw,44px);letter-spacing:2px;margin:14px 0 12px}.hero p{color:#667367;margin:0;max-width:550px}.leaf{position:absolute;right:15px;top:10px;width:95px;height:140px;background:#dce7cc;border-radius:90% 0 90% 0;transform:rotate(22deg);opacity:.6;z-index:-1}.card{background:#fff;border:1px solid #e6e7da;border-radius:24px;padding:34px;box-shadow:0 14px 48px #254b3210}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #eceee5;padding-bottom:20px;margin-bottom:24px}.intro h2{font-size:18px;margin:0}.intro span{font-size:13px;color:#798273}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}.required{color:#a57330;font-size:12px;margin-left:6px}.optional{font-size:12px;color:#889381;font-weight:400;margin-left:6px}input,textarea{display:block;width:100%;border:1px solid #dce2d5;border-radius:10px;background:#fcfdf9;padding:13px 14px;font:inherit;color:#213c2c;outline:none;transition:.2s}input:focus,textarea:focus{border-color:#538463;box-shadow:0 0 0 3px #53846318}input::placeholder,textarea::placeholder{color:#929a8c;font-size:14px}.hint{font-size:12px;color:#87907f;margin:6px 0 0}.full{grid-column:1/-1}textarea{resize:vertical;min-height:96px}.bottom{margin-top:26px;border-top:1px solid #eceee5;padding-top:24px}.note{font-size:13px;color:#788572;margin:0 0 18px}.submit{width:100%;border:0;border-radius:12px;padding:16px;background:var(--green);color:#fff;font:inherit;font-weight:700;letter-spacing:2px;cursor:pointer}.submit:hover{background:#246342}.status{font-size:13px;color:#855c20;margin:12px 0 0}.footer{text-align:center;color:#89917f;font-size:12px;letter-spacing:1px;padding:24px}.pill{display:inline-block;color:#917236;background:#f4efdf;border-radius:99px;padding:4px 12px;font-size:12px;margin-top:15px}@media(max-width:600px){.page{margin:24px auto;padding:0 18px}.card{padding:24px 20px}.grid{grid-template-columns:1fr;gap:20px}.intro{align-items:flex-start}.hero{padding-bottom:24px}.leaf{width:65px;height:100px;right:0}}
</style></head><body><main class="page"><header class="hero"><div class="brand">苗圃農產行</div><div class="leaf" aria-hidden="true"></div><h1>客戶資料登記</h1><p>留下您的聯絡資料，讓我們為您安排後續聯繫與配送。</p><span class="pill">新鮮蔬菜 · 冷藏配送</span></header><section class="card"><div class="intro"><h2>聯絡與店家資訊</h2><span>＊為必填欄位</span></div><form id="registration" method="POST" target="_blank" accept-charset="UTF-8"><div class="grid">
<div class="field"><label for="customerName">大名<span class="required">＊</span></label><input id="customerName" name="customerName" placeholder="請輸入聯絡人姓名" autocomplete="name" maxlength="80" required></div>
<div class="field"><label for="phone">手機<span class="required">＊</span></label><input id="phone" name="phone" type="tel" placeholder="例如 0912345678" autocomplete="tel" maxlength="30" pattern="[+0-9 ()－-]{6,30}" required></div>
<div class="field"><label for="lineId">LINE ID<span class="optional">選填</span></label><input id="lineId" name="lineId" placeholder="請輸入您的 LINE ID" maxlength="80"><p class="hint">若未設定 LINE ID，可略過。</p></div>
<div class="field"><label for="storeName">店名<span class="required">＊</span></label><input id="storeName" name="storeName" placeholder="請輸入店家名稱" autocomplete="organization" maxlength="150" required><p class="hint">個人客戶請填「個人」。</p></div>
<div class="field full"><label for="jobTitle">職務<span class="required">＊</span></label><input id="jobTitle" name="jobTitle" placeholder="例如：負責人、採購、店長" autocomplete="organization-title" maxlength="80" required><p class="hint">個人客戶請填「個人」。</p></div>
<div class="field full"><label for="address">店址<span class="required">＊</span></label><textarea id="address" name="address" placeholder="請輸入縣市、區鄉鎮、路名及門牌" autocomplete="street-address" maxlength="500" required></textarea><p class="hint">請填寫完整店家或配送地址。</p></div></div><div class="bottom"><p class="note">送出後將開啟結果頁，請以結果頁顯示「登記成功」確認資料已儲存。</p><button class="submit" type="submit">送出客戶資料</button><p id="status" class="status" role="status"></p></div></form></section><footer class="footer">苗圃農產行 · 新鮮蔬菜 · 冷藏配送</footer></main><script>
// 將下方網址替換成 Apps Script 網頁應用程式部署的 /exec 網址。
const SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';
const form=document.getElementById('registration');
form.addEventListener('submit',event=>{
 const status=document.getElementById('status');
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(SCRIPT_URL)){event.preventDefault();status.textContent='表單尚未啟用，請聯絡店家。';return;}
 for(const name of ['customerName','phone','storeName','jobTitle','address']){const input=form.elements[name];input.value=input.value.trim();if(!input.value){event.preventDefault();input.focus();status.textContent='請完成所有必填欄位。';return;}}
 form.action=SCRIPT_URL;
 status.textContent='已開啟送出結果頁，請查看結果頁是否登記成功。';
});
</script></body></html>
